  <image href="data:image/svg+xml;charset=utf-8;base64," xlink:href="data:image/svg+xml;charset=utf-8;base64," x="12" y="12" width="41" height="41" preserveAspectRatio="xMidYMid fit"></image>
  <text x="65" y="25" fill="#e0e0e0" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="500">Made with</text>
